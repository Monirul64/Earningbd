
{% extends "base.html" %}

{% block content %}

<section class="formwrap">

    <!-- Page Title -->
    <h1>নতুন পাসওয়ার্ড</h1>

    <!-- Reset Password Form -->
    <form class="formcard" method="post">

        {{ form.hidden_tag() }}

        <!-- Password Fields -->
        {% for f in [form.password, form.confirm] %}

            <label>

                {{ f.label }}

                {{ f(class_="input") }}

                <!-- Validation Errors -->
                {% for e in f.errors %}

                    <small class="error">
                        {{ e }}
                    </small>

                {% endfor %}

            </label>

        {% endfor %}

        <!-- Submit Button -->
        {{ form.submit(class_="btn full") }}

    </form>

</section>

{% endblock %}
