{% extends "base.html" %}{% block content %}<section class="formwrap"><span class="eyebrow">CREATE ACCOUNT</span><h1>সাইন আপ</h1><form class="formcard" method="post">{{ form.hidden_tag() }}{% for f in [form.username,form.email,form.password,form.confirm] %}<label>{{ f.label }}{{ f(class_="input") }}{% for e in f.errors %}<small class="error">{{ e }}</small>{% endfor %}</label>{% endfor %}{{ form.submit(class_="btn full") }}</form><p>অ্যাকাউন্ট আছে? <a href="{{ url_for('login') }}">লগইন</a></p></section>{% endblock %}
