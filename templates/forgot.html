
{% extends "base.html" %}

{% block content %}

<section class="formwrap">

    <!-- Page Title -->
    <h1>পাসওয়ার্ড রিসেট</h1>

    <!-- Instructions -->
    <p class="muted">
        অ্যাকাউন্টের ইমেইল লিখুন।
        ডেমো সংস্করণে রিসেট লিংক স্ক্রিনে দেখানো হবে;
        লাইভে ইমেইল পরিষেবা যুক্ত করতে হবে।
    </p>

    <!-- Password Reset Form -->
    <form class="formcard" method="post">

        {{ form.hidden_tag() }}

        <!-- Email Field -->
        <label>
            {{ form.email.label }}

            {{ form.email(class_="input") }}
        </label>

        <!-- Submit Button -->
        {{ form.submit(class_="btn full") }}

    </form>

</section>

{% endblock %}
